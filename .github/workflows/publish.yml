name: Publish to NPM

on:
  release:
    types: [published]

# id-token lets npm verify this workflow via OIDC (trusted publishing), so no NPM_TOKEN
# secret is needed and provenance is attached automatically.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm 11.5.1+; Node 22 ships npm 10
      - name: Update npm
        run: npm install -g npm@11.21.1

      - name: Install dependencies
        run: npm ci

      - name: Publish to NPM
        run: npm publish
